# Example config for alternate ONNX deployment artifacts.
# The default committed config already targets the expected two-stage wav2vec2
# export under models/phaseD_frozen_ensemble_deploy/. Copy this file if you
# want to point the app at a different ONNX export layout.
# The filenames below are examples only; the corresponding binaries are not
# committed in this repository snapshot.

# --- Model location and backend ---
# Two-stage wav2vec2 pipeline example: backbone + head exported separately.
# If you only have a single ONNX file, set head_model_path: null and use
# backend: onnx instead.
model_path: models/wav2vec2_backbone.onnx
head_model_path: models/wav2vec2_head.onnx
backend: wav2vec2_two_stage

# --- Audio contract (matches training/export assumptions) ---
sample_rate: 16000
expected_input_seconds: 60.0

# --- Preprocessing behavior ---
pad_mode: zero
truncate_mode: center

# --- Tensor layout ---
input_name: null
input_dtype: float32
add_batch_dim: true

# --- Labels and risk banding ---
label_names: [non_dementia, dementia]
positive_class_index: 1
risk_band_thresholds: [0.33, 0.66]

# Optional: per-marker score names if/when the model exposes them.
marker_names: []
