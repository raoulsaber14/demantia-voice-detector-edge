[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dementia-voice-screening"
version = "0.1.0"
description = "EECE 490/690 — Edge-oriented dementia risk screening support from speech audio."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Zeina Hammoud" },
  { name = "Celine Sadaka" },
  { name = "Raoul Saber" }
]
dependencies = [
  "pandas",
  "openpyxl",
  "numpy",
  "matplotlib",
  "librosa",
  "soundfile",
  "scipy",
  "scikit-learn",
  "tqdm",
  "joblib",
  "torch",
  "torchaudio",
  "transformers",
  "datasets",
  "evaluate",
  "accelerate",
  "jupyter",
  "streamlit"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[tool.setuptools]
packages = ["src", "edge_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
